name: Release

on:
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    # Tell GitHub what OS to run this on
    runs-on: ubuntu-latest

    # The sequential steps to execute
    steps:
      # Step A: Pull down your repository code into the runner
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Step B: Install a specific version of Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
